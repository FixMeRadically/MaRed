plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        dependencies { runtime project(':genesis-core') }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.addAll '--username', 'fix'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':genesis-core')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// NeoForge Jar-in-Jar includes the exact same library used by this mod.
def genesisMetadata = layout.buildDirectory.dir('generated/genesis-jarjar')
tasks.register('genesisJarJarMetadata') {
    inputs.property('genesisVersion', provider { project(':genesis-core').version.toString() })
    outputs.dir(genesisMetadata)
    doLast {
        def metadata = genesisMetadata.get().file('META-INF/jarjar/metadata.json').asFile
        metadata.parentFile.mkdirs()
                def coreVersion = project(':genesis-core').version.toString()
        metadata.text = groovy.json.JsonOutput.toJson([jars: [[
            identifier: [group: 'com.fixmer.genesis', artifact: 'genesis-core'],
            version: [range: "[${coreVersion},0.2.0)", artifactVersion: coreVersion],
            path: "META-INF/jarjar/genesis-core-${coreVersion}.jar"
        ]]])
    }
}
tasks.named('jar') {
    dependsOn ':genesis-core:jar', 'genesisJarJarMetadata'
    from(genesisMetadata)
    from(project(':genesis-core').tasks.named('jar')) { into 'META-INF/jarjar' }
}

// Explicit dependency-free regression main, using the compiled mod and real game classpath.
tasks.register('runtimeIntegrationChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fixmer.mared.RuntimeIntegrationChecks'
    workingDir layout.buildDirectory.dir('runtime-checks').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn 'runtimeIntegrationChecks' }
// Keep conventional tests enabled so future JUnit suites participate in check.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir("junit-checks/${name}").get().asFile
    doFirst { workingDir.mkdirs() }
}

// Inspect the shipped archive with FML, instead of testing only a flat Java classpath.
tasks.withType(Test).configureEach {
    dependsOn tasks.named('jar')
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
    systemProperty 'genesis.packagedMod', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

// Copy tasks can retain removed outputs: remove the obsolete bundled MC templates on rebuild.
tasks.register('purgeObsoleteCommandTemplates', Delete) {
    delete layout.buildDirectory.dir('resources/main/mared/commands')
}
tasks.named('processResources') {
    dependsOn 'purgeObsoleteCommandTemplates'
}
