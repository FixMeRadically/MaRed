plugins { id 'java-library'; id 'maven-publish' }
group = 'com.fixmer.genesis'
version = '0.1.8'
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
publishing { publications { core(MavenPublication) { from components.java } } }

// NeoForge must put this dependency in its GAME layer, not the boot/library layer.
tasks.named('jar', Jar) {
    manifest.attributes(
        'FMLModType': 'GAMELIBRARY',
        'Automatic-Module-Name': 'com.fixmer.genesis.core',
        'Implementation-Version': project.version.toString()
    )
}
