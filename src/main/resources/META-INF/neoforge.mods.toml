# Mared — mod metadata file for NeoForge.
# Формат — TOML v0.5.0. Подробнее: https://github.com/toml-lang/toml

modLoader="javafml"
loaderVersion="${loader_version_range}"

# Лицензия. Оставьте "All Rights Reserved", пока не решите иначе.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Mared — мод для создания сценариев, квестов и визуального программирования прямо в мире.
'''

# Раскомментируйте, если позже добавите mixins.
#[[mixins]]
#config="${mod_id}.mixins.json"

# Раскомментируйте, если позже добавите access transformers.
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"