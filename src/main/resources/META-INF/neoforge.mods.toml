modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/fixmer/mared/issues"

[[mods]]
modId = "mared"
version = "${mod_version}"
displayName = "Mared"
authors = "fixmer"
description = '''
Mared — мощный скриптовый движок для Minecraft с гибридным синтаксисом,
биндами на клавиши, событиями, persistent-скриптами и редактором в игре.
'''
logoFile = "mared_logo.png"

[[dependencies.mared]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.mared]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "mared.mixins.json"