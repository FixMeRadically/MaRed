plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Detailed registry logging is opt-in; keep ordinary restart startup free of debug output.
def genesisDebugLogs = providers.gradleProperty('maredDebugLogs').map { it.toBoolean() }.getOrElse(false)
runs {
    configureEach {
        if (genesisDebugLogs) systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', genesisDebugLogs ? 'debug' : 'info' 
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        dependencies { runtime project(':genesis-core') }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.addAll '--username', 'fix'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':genesis-core')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// NeoForge Jar-in-Jar includes the exact same library used by this mod.
def genesisMetadata = layout.buildDirectory.dir('generated/genesis-jarjar')
tasks.register('genesisJarJarMetadata') {
    inputs.property('genesisVersion', provider { project(':genesis-core').version.toString() })
    outputs.dir(genesisMetadata)
    doLast {
        def metadata = genesisMetadata.get().file('META-INF/jarjar/metadata.json').asFile
        metadata.parentFile.mkdirs()
                def coreVersion = project(':genesis-core').version.toString()
        metadata.text = groovy.json.JsonOutput.toJson([jars: [[
            identifier: [group: 'com.fixmer.genesis', artifact: 'genesis-core'],
            version: [range: "[${coreVersion},0.2.0)", artifactVersion: coreVersion],
            path: "META-INF/jarjar/genesis-core-${coreVersion}.jar"
        ]]])
    }
}
tasks.named('jar') {
    dependsOn ':genesis-core:jar', 'genesisJarJarMetadata'
    from(genesisMetadata)
    from(project(':genesis-core').tasks.named('jar')) { into 'META-INF/jarjar' }
}

// Explicit dependency-free regression main, using the compiled mod and real game classpath.
tasks.register('runtimeIntegrationChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fixmer.mared.RuntimeIntegrationChecks'
    workingDir layout.buildDirectory.dir('runtime-checks').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn 'runtimeIntegrationChecks' }
// Keep conventional tests enabled so future JUnit suites participate in check.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir("junit-checks/${name}").get().asFile
    doFirst { workingDir.mkdirs() }
}

// Inspect the shipped archive with FML, instead of testing only a flat Java classpath.
tasks.withType(Test).configureEach {
    dependsOn tasks.named('jar')
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
    systemProperty 'genesis.packagedMod', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

// Copy tasks can retain removed outputs: remove the obsolete bundled MC templates on rebuild.
tasks.register('purgeObsoleteCommandTemplates', Delete) {
    delete layout.buildDirectory.dir('resources/main/mared/commands')
}
tasks.named('processResources') {
    dependsOn 'purgeObsoleteCommandTemplates'
}

// A private bootstrap resource for FML/module launches. This is built by the mod itself.
def supervisorClasses = layout.buildDirectory.dir('supervisor/classes')
tasks.register('compileSupervisorBootstrap', JavaCompile) {
    source = fileTree('src/main/java') { include 'com/fixmer/genesis/supervisor/**' }
    classpath = files()
    destinationDirectory = supervisorClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 21
}
// Isolated agent: no agent classes on the game/module classpath.
sourceSets.main.java.exclude 'com/fixmer/genesis/startup/**'
def startupAgentClasses = layout.buildDirectory.dir('startup-agent/classes')
tasks.register('compileStartupAgent', JavaCompile) {
    source = fileTree('src/main/java') { include 'com/fixmer/genesis/startup/**' }
    classpath = files()
    destinationDirectory = startupAgentClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 17
}
def startupAgentArchive = tasks.register('startupAgentJar', Jar) {
    dependsOn 'compileStartupAgent'
    archiveFileName = 'startup-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('startup-agent/resource')
    from startupAgentClasses
    manifest { attributes 'Premain-Class': 'com.fixmer.genesis.startup.PathCacheAgent' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def supervisorBootstrap = tasks.register('supervisorBootstrapJar', Jar) {
    dependsOn 'compileSupervisorBootstrap', startupAgentArchive
    archiveFileName = 'supervisor-bootstrap.jar'
    destinationDirectory = layout.buildDirectory.dir('supervisor/resource/mared/dev')
    from supervisorClasses
    from(startupAgentArchive.flatMap { it.archiveFile }) { into 'mared/dev' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('processResources') {
    dependsOn supervisorBootstrap
    from(supervisorBootstrap.flatMap { it.archiveFile }) { into 'mared/dev' }
}


// A Java String is required at collection/reflection boundaries: GString.equals(String)
// is false even when the text matches. Shared with the build-time regression check.
def genesisSeedArgument = { File seed -> "-Dgenesis.launch.seed=${seed.absolutePath}".toString() }
tasks.register('genesisCaptureChecks') {
    doLast {
        def genesisProofMarker = genesisSeedArgument(new File(projectDir,'capture-type-proof.properties'))
        if (!(genesisProofMarker instanceof String) || ![genesisProofMarker.toString()].contains(genesisProofMarker))
            throw new GradleException('Genesis seed argument must be a Java String')
    }
}
tasks.named('check') { dependsOn 'genesisCaptureChecks' }

// Stage 12: capture lazily when JavaExec evaluates its effective arguments.
// Capture a build-content baseline in Gradle and confirm it in the game; no extra helper JVM.
tasks.withType(JavaExec).configureEach { launchTask ->
    if (launchTask.name == 'runClient') {
        dependsOn supervisorBootstrap
        def armed = false
        def collecting = false
        def attempted = false
        String captureState = "pending"
        def seedFile = null
        def captureId = UUID.randomUUID().toString()
        doFirst { armed = true }
        launchTask.jvmArgumentProviders.add({
            if (!armed) return []
            if (seedFile == null) seedFile = new File(launchTask.workingDir, "config/mared/dev/launch-seed-${captureId}.properties")
            String marker = genesisSeedArgument(seedFile)
            // Reentrant allJvmArgs only needs the seed marker, never an in-progress state
            // in the cached command. The real launch receives the final bounded state.
            if (collecting) return [marker]
            if (attempted) return [marker, '-Dgenesis.launch.capture='+captureState]
            collecting = true
            attempted = true
            String captureStage = 'java_entry'
            try {
                def snapshot = new Properties()
                snapshot.setProperty('schema', '2')
                snapshot.setProperty('captureId', captureId)
                snapshot.setProperty('projectDir', rootProject.projectDir.absolutePath)
                snapshot.setProperty('workDir', launchTask.workingDir.absolutePath)
                // JavaExec.commandLine may contain only executable + application arguments.
                // Read the public JavaForkOptions + JavaExec components explicitly instead.
                def executable = launchTask.executable
                if (executable == null || !new File(executable).isAbsolute()) {
                    def launcher = launchTask.javaLauncher.orNull
                    if (launcher != null) executable = launcher.executablePath.asFile.absolutePath
                }
                if (executable == null || !new File(executable).isAbsolute()) throw new GradleException('Unresolved Java executable')
                if (launchTask.mainModule.present) throw new GradleException('Capture of inferred module entry is unsupported')
                captureStage = 'jvm_options'
                def jvm = launchTask.allJvmArgs.collect { it.toString() }
                if (!jvm.contains(marker)) throw new GradleException('Missing JVM confirmation marker')
                captureStage = 'application'
                def application = (launchTask.args ?: []).collect { it.toString() }
                launchTask.argumentProviders.each { provider -> application.addAll(provider.asArguments().collect { it.toString() }) }
                def launchMainClass = launchTask.mainClass.orNull
                def classpath = launchTask.classpath.files.collect { it.absolutePath }
                // The same JDK-only command assembler is exercised by actual child replay tests.
                captureStage = 'assemble'
                def commandHelper = new URLClassLoader([supervisorBootstrap.get().archiveFile.get().asFile.toURI().toURL()] as URL[],ClassLoader.getPlatformClassLoader())
                def cmd
                try {
                    def type = commandHelper.loadClass('com.fixmer.genesis.supervisor.JavaExecCommand')
                    cmd = type.getMethod('classic',String.class,List.class,List.class,String.class,List.class)
                        .invoke(null,executable,jvm,classpath,launchMainClass,application)
                } finally { commandHelper.close() }
                snapshot.setProperty('command.count', cmd.size().toString())
                cmd.eachWithIndex { value, i -> snapshot.setProperty("command.${i}", value) }
                launchTask.environment.each { key, value ->
                    if (value != null && !key.toString().startsWith('GENESIS_') && System.getenv(key.toString()) != value.toString())
                        snapshot.setProperty("env.${key}", value.toString())
                }
                captureStage = 'build_inputs'
                def inputs = new LinkedHashSet<File>()
                rootProject.allprojects.each { prj ->
                    ['build.gradle','build.gradle.kts','settings.gradle','settings.gradle.kts','gradle.properties'].each { inputs.add(new File(prj.projectDir,it)) }
                    def sets = prj.extensions.findByName('sourceSets')
                    if (sets != null) { def sourceMainSet = sets.findByName('main'); if (sourceMainSet != null) { inputs.addAll(sourceMainSet.allSource.srcDirs); inputs.addAll(sourceMainSet.output.files) } }
                }
                inputs.add(new File(rootProject.projectDir,'gradle'))
                ['buildSrc/src','buildSrc/build.gradle','buildSrc/build.gradle.kts','buildSrc/settings.gradle','buildSrc/settings.gradle.kts','buildSrc/gradle.properties'].each { inputs.add(new File(rootProject.projectDir,it)) }
                inputs.addAll(launchTask.classpath.files)
                inputs.add(new File(cmd[0]))
                inputs.add(new File(new File(cmd[0]).parentFile.parentFile,'release'))
                captureStage = 'native_inputs'
                def natives = new LinkedHashSet<File>()
                cmd.findAll { it.startsWith('-Djava.library.path=') || it.startsWith('-Dorg.lwjgl.librarypath=') }.each { value ->
                    value.substring(value.indexOf('=')+1).split(java.util.regex.Pattern.quote(File.pathSeparator),-1).each { part ->
                        def path = part.isEmpty() ? launchTask.workingDir : new File(part)
                        natives.add(path.isAbsolute() ? path : new File(launchTask.workingDir,part))
                    }
                }
                cmd.findAll { it.startsWith('-javaagent:') }.each { value -> def path = new File(value.substring(11).split('=',2)[0]); inputs.add(path.isAbsolute() ? path : new File(launchTask.workingDir,path.path)) }
                cmd.findAll { it.startsWith('@') }.each { value -> def path = new File(value.substring(1)); inputs.add(path.isAbsolute() ? path : new File(launchTask.workingDir,path.path)) }
                def paths = inputs.collect { it.absolutePath }.sort()
                snapshot.setProperty('input.count', paths.size().toString())
                paths.eachWithIndex { value, i -> snapshot.setProperty("input.${i}", value) }
                def nativePaths = natives.collect { it.toPath().toAbsolutePath().normalize().toString() }.unique().sort()
                snapshot.setProperty('native.count',nativePaths.size().toString())
                nativePaths.eachWithIndex { value, i -> snapshot.setProperty("native.${i}",value) }
                // Load only the JDK-only helper; do not fork another JVM or retain the JAR lock.
                captureStage = 'baseline'
                def helper = new URLClassLoader([supervisorBootstrap.get().archiveFile.get().asFile.toURI().toURL()] as URL[],ClassLoader.getPlatformClassLoader())
                try {
                    def type = helper.loadClass('com.fixmer.genesis.supervisor.DirectLaunchPlan')
                    type.getMethod('captureBaseline',Properties.class).invoke(null,snapshot)
                } finally { helper.close() }
                captureStage = 'write_seed'
                seedFile.parentFile.mkdirs()
                def temp = java.nio.file.Files.createTempFile(seedFile.parentFile.toPath(),'seed-','.tmp')
                try {
                    try { java.nio.file.Files.setPosixFilePermissions(temp,java.nio.file.attribute.PosixFilePermissions.fromString('rw-------')) }
                    catch (UnsupportedOperationException ignored) { }
                    java.nio.file.Files.newBufferedWriter(temp,java.nio.charset.StandardCharsets.UTF_8).withCloseable { writer -> snapshot.store(writer,'Genesis private launch seed; do not share') }
                    java.nio.file.Files.move(temp,seedFile.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                } finally { java.nio.file.Files.deleteIfExists(temp) }
                captureState = "ready"
                logger.lifecycle('Genesis: effective JVM launch seed saved; validation will run in the game background.')
            } catch (Exception error) {
                // Exception class only: messages can include private command/environment values.
                captureState = 'failed_'+captureStage
                logger.lifecycle('Genesis: JVM launch capture unavailable at '+captureStage+' ('+error.class.simpleName+'); configured launcher retained.')
            } finally { collecting = false }
            return [marker, '-Dgenesis.launch.capture='+captureState]
        } as org.gradle.process.CommandLineArgumentProvider)
    }
}

// Portable setup UI: includes the same core JAR and Python controller as the build.
// No paths, credentials or developer profiles are included in this resource.
def genesisServerSetup59 = tasks.register('genesisServerSetup59', Zip) {
    dependsOn ':genesis-core:jar'
    archiveFileName = 'controller.zip'
    destinationDirectory = layout.buildDirectory.dir('server59-bundle')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('tools') {
        include 'first_launch.py', 'server_setup.py', 'server_panel66.py', 'remote_update.py', 'control_setup73.py', 'dedicated_server74.py', 'dedicated_server75.py', 'remote_client70.py', 'first58/**/*.py'
        exclude '**/__pycache__/**'
        into 'tools'
    }
    from(project(':genesis-core').tasks.named('jar')) {
        into 'runtime'
        rename { 'core.jar' }
    }
}
tasks.named('processResources') {
    dependsOn genesisServerSetup59
    from(genesisServerSetup59.flatMap { it.archiveFile }) { into 'genesis/server59' }
}
tasks.register('serverSetupResourceChecks59', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fixmer.mared.ServerSetupResourceChecks59'
}
tasks.named('check') { dependsOn 'serverSetupResourceChecks59' }

